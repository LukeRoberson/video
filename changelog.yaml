- version: "1.3.1"
  date: "2026-04-05"
  features:
    - None
  code:
    - Added threading to similarity script (#14)
    - Added metadata caching to similarity calculations to reduce database queries
    - Split the project into a frontend (UI) and backend (API, DB) to improve maintainability and scalability
    - Added unit tests for the backend API using using pytest
    - Added API documentation using Swagger/OpenAPI
    - Standardised API responses
    - Simplified and consolidated API endpoints
    - Moved the user session management to the frontend (the backend is stateless)
    - Improved the Docker deployment of the application
    - Added better logging
    - Added a debug mode to the backend
  fixes:
    - Fixed copying video URL at current time in theatre mode (#20)
    - Fixed theatre mode not working in a theme (#18)

- version: "1.3.0"
  date: 2025-11-06
  features:
    - Greatly improved search functionality using Elasticsearch
    - Added a separate Elasticsearch container to the Docker Compose setup
    - Fallback to basic search if Elasticsearch container is unavailable
  code:
    - Added docker-compose.yaml file, so the app can be deployed directly from Github
  fixes:
    - None

- version: "1.2.0"
  date: "2025-10-11"
  features:
    - Added a badge to tags to show number of associated items
    - Added a 'hide watched items' filter to the navigation bar
    - Cleaned up descriptions on character and scripture pages
    - Reformatted the scriptures page for better usability
    - Added new features to theme pages
    - Added support for subtitles (not all videos have them yet)
  code:
    - Added JSDoc comments for better code documentation
    - Refactored JavaScript code to TypeScript
    - Refactored CSS to use BEM format
  fixes:
    - Click outside of theatre mode to exit theatre mode
    - Touch screen play/pause tap support
    - Cleaned up descriptions on character and scripture pages by adding new line conversion
    - Fixed profile editing when running in a container
    - Fixed snippets when running in a container
    - Fixed categories missing on some videos
    - Fixed incorrect count on progress bar for some categories
    - Fixed admin page adding categories to videos
