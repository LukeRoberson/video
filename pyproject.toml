[project]
name = "1320"
version = "1.3.1"
description = "Video streaming for videos on jw.org"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.2",
    "pandas==3.0.2",
    "requests==2.33.1",
    "PyYAML==6.0.3"
]

# Optional dependencies for development
[project.optional-dependencies]
backend = [
    "db==0.1.1",
    "db-sqlite3==0.0.1",
    "elasticsearch==8.19.3",
    "flask-swagger-ui==5.32.1.post2"
]
frontend = [
    "Cerberus==1.3.8"
]
dev = [
    "pytest==8.4.1",
    "selenium==4.34.2", 
    "tqdm==4.67.1",
    "beautifulsoup4==4.13.4",
    "pillow==11.3.0"
]

[tool.flake8]
max-line-length = 88
exclude = ["__pycache__", "static", "templates"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
omit = [
    "tests/*",
    "app/*"
]