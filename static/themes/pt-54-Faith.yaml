# Section 1
section:
- heading: What is True Faith?

- subheading: True Faith is Based on Convincing Evidence
- paragraph: >
    Many people think of faith as believing in something without any evidence.
    Is this really the case?

- quote: >
    Faith is the assured expectation of things hoped for, the evident demonstration of realities that are not seen.
    — Hebrews 11:1
- paragraph: >
    Hebrews 11:1 provides a clear definition of what faith is. It is two primary things:
- list:
    - The assured expectation of things hoped for
    - The evident demonstration of realities that are not seen

- video_grid:
  - video:
      id: 1079
      title: A Definition of True Faith
      start: 88
      end: 295
  - video:
      id: 1078
      title: Faith in God's Existence
      start: 244
      end: 405
  - video:
      id: 1036
      title: Convincing Evidence
      start: 1619
      end: 1665

- paragraph: |
    An Assured Expectation.
    Faith is the conviction that we will have the things that we hope for. This is as sure as our conviction that the sun will rise each day.
    Faith makes the future things promised by God as real to us as if we already have them now.
    A person with true faith firmly believes that everything God has told us is true, and that all his promises will be fulfilled.
- paragraph: |
    Realities that are Not Seen.
    We have a cell phone, which allows communication without wires. It uses radio waves. We cannot see the radio waves, but we know they are there, because we can see the effect they have.
    This shows that we don't need to physically see something to know that it exists.
    Hebrews 11:3 says that we can see the 'systems of things' that have been put into place. An example is the various cycles that keep our planet habitable. Seeing these systems shows that someone had to design them.
- paragraph: |
    Convincing Evidence.
    The footnote to Hebrews 11:1 says that 'evident demonstration' means 'convincing evidence'.
    True faith is not something that is unquestioning or irrational. It is not foolish or gullible. It is not quick to believe something with little or no evidence.
    Faith is not believing something just because it sounds good. Our faith is built on solid and convincing evidence, which comes from the careful study and accurate knowledge of God's word.

- subheading: True Faith Moves a Person to Action
- quote: >
    You believe that there is one God, do you? You are doing quite well. And yet the demons believe and shudder.
    But do you care to know, O empty man, that faith without works is useless?
    — James 2:17
- video_grid:
  - video:
      id: 1079
      title: What Faith is Not
      start: 376
      end: 413

- paragraph: |
    Being convinced that something is true is only the first step. True faith also moves a person to action.
    True faith means coming to know Jehovah, and to trust him. It means forming an unbreakable friendship with him.

