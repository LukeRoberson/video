    # -------------------
    #   Error Responses
    # -------------------
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: No data provided
    ErrorBadRequest:
      type: object
      properties:
        error:
          type: string
          description: Error message for 400 Bad Request
          example: "'video_ids' must be a list of integers"
        success:
          type: boolean
          description: Set to false, as the request was invalid
          example: false
    ErrorNotFound:
      type: object
      properties:
        error:
          type: string
          description: Error message for 404 Not Found
          example: Resource not found
        success:
          type: boolean
          description: Set to false, as the resource was not found
          example: false

  responses:
    NotFound:
      description: 404 Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNotFound'
    BadRequest:
      description: |
        400 Invalid request parameters  
        Typically means the request body or parameters are malformed.  
        For example, integers are expressed as integers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBadRequest'
    UnsupportedMediaType:
      description: |
        415 Unsupported media type.  
        Typically means a request body is required but was not provided.  
        Also check the Content-Type header is present and correct.  
    InternalServerError:
      description: 500 Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 503 Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
