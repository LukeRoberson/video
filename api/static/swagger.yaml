openapi: 3.0.4

info:
  title: Video Player
  version: 1.0.0
  description: |
    The backend API for the modern web-based video streaming interface for accessing educational content from jw.org and JW Library.
    This manages the backend database opterations, as well as profiles.

servers:
  - url: /
    description: Main server

tags:
  - name: Videos
    description: Information about videos, including metadata and streaming URLs.
  - name: Categories
    description: Category information for videos, reflecting those used on jw.org and JW Library.
  - name: Bible Characters
    description: Information about Bible characters featured in the videos.
  - name: Scriptures
    description: Information about scriptures referenced in the videos.
  - name: Speakers
    description: Information about speakers featured in the videos.
  - name: Tags
    description: Information about tags associated with the videos.
  - name: Search
    description: Endpoints for searching videos based on various criteria.
  - name: Similarity
    description: Endpoints for finding similar videos based on content and metadata.
  - name: Profiles
    description: Information about user profiles and their preferences.
  - name: Admin
    description: Endpoints for administrative tasks, such as adding videos and managing metadata.

paths:
  # ----------
  #   Health
  # ----------
  /api/health:
    get:
      tags: [Admin]
      summary: Check API health
      description: |
        A simple endpoint to check if the API is running and healthy.
        This can be used for monitoring and health checks.
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'


  # ----------
  #   Videos
  # ----------
  /api/videos/get_bulk:
    post:
      tags: [Videos]
      summary: Retrieve a list of videos
      description: |
        Get details for multiple videos at once.
        This is more efficient than making individual requests for each video.
      requestBody:
        description: A list of video IDs to retrieve
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestVideoIDs'
      responses:
        '200':
          summary: Successful response
          description: A list of videos retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VideoItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/videos/filter:
    get:
      tags: [Videos]
      summary: Retrieve a filtered list of videos
      description: |
        Get a list of videos filtered by various criteria, such as category, speaker, scripture, etc.
        This allows for more specific queries to find relevant videos.
        At least one filter parameter must be provided.
      parameters:
        - in: query
          name: cat
          required: false
          schema:
            type: integer
          description: Filter videos by category ID
          example: 1
        - in: query
          name: tag
          required: false
          schema:
            type: integer
          description: Filter videos by tag ID
          example: 1
        - in: query
          name: loc
          required: false
          schema:
            type: integer
          description: Filter videos by location ID
          example: 1
        - in: query
          name: speak
          required: false
          schema:
            type: integer
          description: Filter videos by a speaker's ID
          example: 1
        - in: query
          name: char
          required: false
          schema:
            type: integer
          description: Filter videos by character ID
          example: 1
        - in: query
          name: scrip
          required: false
          schema:
            type: integer
          description: Filter videos by scripture ID
          example: 1
        - in: query
          name: latest
          required: false
          schema:
            type: integer
          description: Limit the results to the latest N videos
          example: 5
      responses:
        '200':
          summary: Successful response
          description: A filtered list of videos retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of video details matching the filter criteria
                        items:
                          $ref: '#/components/schemas/VideoItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/videos/metadata:
    get:
      tags: [Videos]
      summary: Retrieve video metadata
      description: |
        Resolve metadata names to IDs. For example, a location name to a location ID.
        This endpoint allows multiple resolution types in a single request.
        Not all metadata fields need to be provided; only those that need to be resolved.
        Can be used to resolve videos, tags, locations, speakers, and characters.
      parameters:
        - in: query
          name: video_name
          required: false
          schema:
            type: string
          description: The name of the video to resolve to an ID
          example: "Can Love Conquer Hatred?"
        - in: query
          name: tag_name
          required: false
          schema:
            type: string
          description: The name of the tag to resolve to an ID
          example: "av"
        - in: query
          name: location_name
          required: false
          schema:
            type: string
          description: The name of the location to resolve to an ID
          example: "Africa"
        - in: query
          name: speaker_name
          required: false
          schema:
            type: string
          description: The name of the speaker to resolve to an ID
          example: "Stephen Lett"
        - in: query
          name: character_name
          required: false
          schema:
            type: string
          description: The name of the character to resolve to an ID
          example: "Jesus"
      responses:
        '200':
          summary: Successful response
          description: Metadata resolved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Resolved metadata with names and corresponding IDs
                        properties:
                          video_id:
                            type: integer
                            description: Unique identifier for the video
                            nullable: true
                          tag_id:
                            type: integer
                            description: Unique identifier for the tag
                            nullable: true
                          location_id:
                            type: integer
                            description: Unique identifier for the location
                            nullable: true
                          speaker_id:
                            type: integer
                            description: Unique identifier for the speaker
                            nullable: true
                          character_id:
                            type: integer
                            description: Unique identifier for the character
                            nullable: true
                        example:
                          video_id: 123
                          tag_id: 45
                          location_id: 67
                          speaker_id: 89
                          character_id: 10
    post:
      tags: [Videos, Admin]
      summary: Add metadata to a video.
      description: |
        Add metadata to an existing video. This allows for associating videos with categories, tags, locations, speakers, characters, and scriptures.
        Also allows updating existing metadata on a video.
      requestBody:
        description: Metadata names to filter by
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_name:
                  type: string
                  description: The name of the video to update
                  example: "David Schafer: Why We Have Faith in . . . God’s Existence"
                description:
                  type: string
                  description: A description of the video
                  example: Video description
                url:
                  type: string
                  description: The URL of the video
                  example: "https://example.com/video"
                tag_name:
                  type: string
                  description: A comma-separated list of tag names to add to the video
                  example: "tag-1, tag-2"
                location_name:
                  type: string
                  description: A comma-separated list of location names to associate with the video
                  example: "Africa, Europe"
                speaker_name:
                  type: string
                  description: A comma-separated list of speaker names to associate with the video
                  example: "Stephen Lett, David Schafer"
                character_name:
                  type: string
                  description: A comma-separated list of character names to associate with the video
                  example: "Jesus, David"
                scripture_name:
                  type: string
                  description: A comma-separated list of scripture names to associate with the video
                  example: "John 3:16, Psalm 23:1"
                category_name:
                  type: string
                  description: A comma-separated list of category names to associate with the video
                  example: "Monthly Programs, Bible Teachings"
                date_added:
                  type: string
                  format: date-time
                  description: The date and time when the video was added to the database
                  example: "2024-01-01T12:00:00Z"
      responses:
        '200':
          summary: Successful response
          description: A filtered list of videos retrieved successfully based on metadata names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/videos/csv:
    get:
      tags: [Videos, Admin]
      summary: Load a CSV of videos to add.
      description: |
        Read a CSV file containing a list of videos that need to be added to the database.
        This endpoint just reads this information, it does not modify the database.
        The CSV file is assumed to be named `missing_videos.csv`, and is stored in `../scripts/csv`.
      responses:
        '200':
          summary: Successful response
          description: Video metadata CSV file generated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    additionalProperties:
                      type: array
                      description: |
                        A list of video metadata entries read from the CSV file, where each entry contains
                        the details of a single video.
                      items:
                        $ref: '#/components/schemas/VideoInputItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/videos/add:
    post:
      tags: [Videos, Admin]
      summary: Add a single video to the database.
      description: |
        Add a video to the database with the provided metadata.
        This is used to add videos that are missing from the database, such as newly released videos.
      requestBody:
        description: Metadata for the video to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoInputItem'
      responses:
        '200':
          summary: Successful response
          description: Video added successfully based on provided metadata names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # --------------
  #   Categories
  # --------------
  /api/categories:
    get:
      tags: [Categories]
      summary: Retrieve a list of categories
      description: |
        Get a list of all categories in the database, reflecting those used on jw.org and JW Library.
        Includes the names of the categories, as well as their IDs.
      responses:
        '200':
          summary: Successful response
          description: A list of categories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: All categories with names and IDs
                        additionalProperties:
                          type: integer
                          description: Unique identifier for the category
                        example:
                          "Monthly Programs": 1
                          "Bible Teachings": 51
                          "Dramas": 1349
    post:
      tags: [Categories]
      summary: Get a filtered list of categories
      description: |
        Get a filtered list of categories by name.
        This resolves names to category IDs.
      requestBody:
        description: The name of the categories to filter by
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                name:
                  type: string
                  description: Name of the category to resolve to ID
                  example: "Monthly Programs"
      responses:
        '200':
          summary: Successful response
          description: A filtered list of categories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of resolved categories matching the filter
                        items:
                          $ref: '#/components/schemas/CategoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/categories/{category_name}:
    get:
      tags: [Categories]
      summary: Resolve a category name to its ID
      description: |
        Get the ID of a specific category by its name.
        This allows for resolving category names to their corresponding IDs.
      parameters:
        - in: path
          name: category_name
          required: true
          schema:
            type: string
          description: The name of the category to resolve to an ID
          example: "Monthly Programs"
      responses:
        '200':
          summary: Successful response
          description: The ID of the specified category retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of resolved categories matching the filter
                        items:
                          $ref: '#/components/schemas/CategoryItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/categories/{category_id}/{subcategory_id}:
    get:
      tags: [Categories]
      summary: Retrieve videos for a category and subcategory
      description: |
        Get a list of videos for a specific category and subcategory combination.
        This allows for browsing videos based on the categories used on jw.org and JW Library.
      parameters:
        - in: path
          name: category_id
          required: true
          schema:
            type: integer
          description: The ID of the category to retrieve videos for
          example: 1
        - in: path
          name: subcategory_id
          required: true
          schema:
            type: integer
          description: The ID of the subcategory to retrieve videos for
          example: 2
      responses:
        '200':
          summary: Successful response
          description: A list of videos for the specified category and subcategory retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of video details for the specified category and subcategory
                        items:
                          $ref: '#/components/schemas/VideoItem'

  /api/categories/video/{video_id}:
    get:
      tags: [Categories]
      summary: Retrieve categories for a video
      description: |
        Get the categories associated with a specific video.
        This allows for understanding the categorization of videos.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
          description: The ID of the video to retrieve categories for
          example: 123
      responses:
        '200':
          summary: Successful response
          description: Categories for the specified video retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of categories associated with the specified video, including category names and IDs
                        items:
                          $ref: '#/components/schemas/CategoryItem'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------
  #   Bible Characters
  # --------------------
  /api/characters:
    get:
      tags: [Bible Characters]
      summary: Retrieve a list of Bible characters
      description: |
        Get a list of all Bible characters, or just one specific character.
        When getting the entire list, it will be sorted alphabetically by name.
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: integer
          description: Optionally include a character's ID to get just that character.
          example: 1
      responses:
        '200':
          summary: Successful response
          description: A list of Bible characters retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: One or more Bible characters with names and IDs
                        items:
                          $ref: '#/components/schemas/CharacterItem'

  /api/characters/video/{video_id}:
    get:
      tags: [Bible Characters]
      summary: Retrieve Bible characters for a video
      description: |
        Get the Bible characters associated with a specific video.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
          description: The ID of the video to retrieve Bible characters for
          example: 123
      responses:
        '200':
          summary: Successful response
          description: Bible characters for the specified video retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of Bible characters associated with the specified video, including character names and IDs
                        items:
                          $ref: '#/components/schemas/CharacterItem'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------
  #   Scriptures
  # --------------

  /api/scriptures:
    get:
      tags: [Scriptures]
      summary: Retrieve a list of scriptures
      description: |
        Get a list of all scriptures, or just one specific scripture.
        When getting the entire list, it will be sorted alphabetically by name.
      parameters:
        - in: query
          name: scr_id
          required: false
          schema:
            type: integer
          description: Optionally include a scripture's ID to get just that scripture.
          example: 1
      responses:
        '200':
          summary: Successful response
          description: A list of scriptures retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: One or more scriptures with names and IDs
                        items:
                          $ref: '#/components/schemas/ScriptureItem'
    post:
      tags: [Scriptures, Admin]
      summary: Add text to a scripture entry
      description: |
        Add text to a scripture entry by providing the scripture ID and the text to add.
        The scripture must already exist in the database.
      requestBody:
        description: The scripture ID and the text to add
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  scr_name:
                    type: string
                    description: The name of the scripture
                    example: "Matthew 19:13"
                  scr_text:
                    type: string
                    description: The text to add to the scripture
                    example: "Then young children were brought to him for him to place his hands on them and offer prayer, but the disciples reprimanded them."
      responses:
        '200':
          summary: Successful response
          description: A filtered list of scriptures retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/scriptures/video/{video_id}:
    get:
      tags: [Scriptures]
      summary: Retrieve scriptures for a video
      description: |
        Get the scriptures associated with a specific video.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
          description: The ID of the video to retrieve scriptures for
          example: 123
      responses:
        '200':
          summary: Successful response
          description: Scriptures for the specified video retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of scriptures associated with the specified video, including scripture names and IDs
                        items:
                          $ref: '#/components/schemas/ScriptureItem'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------
  #   Speakers
  # ------------

  /api/speakers:
    get:
      tags: [Speakers]
      summary: Retrieve a list of speakers
      description: |
        Get a list of all speakers, or just one specific speaker.
        When getting the entire list, it will be sorted alphabetically by name.
      parameters:
        - in: query
          name: spk_id
          required: false
          schema:
            type: integer
          description: Optionally include a speaker's ID to get just that speaker.
          example: 1
      responses:
        '200':
          summary: Successful response
          description: A list of speakers retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: One or more speakers with names and IDs
                        items:
                          $ref: '#/components/schemas/SpeakerItem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/speakers/{speaker_id}:
    get:
      tags: [Speakers]
      summary: Retrieve details for a specific speaker
      description: |
        Get detailed information about a specific speaker by their ID.
      parameters:
        - in: path
          name: speaker_id
          required: true
          schema:
            type: integer
          description: The ID of the speaker to retrieve details for
          example: 1
      responses:
        '200':
          summary: Successful response
          description: Details for the specified speaker retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpeakerItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/speakers/video/{video_id}:
    get:
      tags: [Speakers]
      summary: Retrieve speakers for a video
      description: |
        Get the speakers associated with a specific video.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
          description: The ID of the video to retrieve speakers for
          example: 123
      responses:
        '200':
          summary: Successful response
          description: Speakers for the specified video retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of speakers associated with the specified video, including speaker names and IDs
                        items:
                          $ref: '#/components/schemas/SpeakerItem'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------
  #   Tags
  # --------

  /api/tags:
    get:
      tags: [Tags]
      summary: Retrieve a list of tags
      description: |
        Get a list of all tags, or just one specific tag.
        When getting the entire list, it will be sorted alphabetically by name.
      parameters:
        - in: query
          name: tag_id
          required: false
          schema:
            type: integer
          description: Optionally include a tag's ID to get just that tag.
          example: 1
      responses:
        '200':
          summary: Successful response
          description: A list of tags retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: One or more tags with names and IDs
                        items:
                          $ref: '#/components/schemas/TagItem'

  /api/tags/video/{video_id}:
    get:
      tags: [Tags]
      summary: Retrieve tags for a video
      description: |
        Get the tags associated with a specific video.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
          description: The ID of the video to retrieve tags for
          example: 123
      responses:
        '200':
          summary: Successful response
          description: Tags for the specified video retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of tags associated with the specified video, including tag names and IDs
                        items:
                          $ref: '#/components/schemas/TagItem'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------
  #   Search
  # ----------
  /api/search/status:
    get:
      tags: [Search]
      summary: Check if the search service is ready
      description: |
        Check if the search service is ready for searching.
        This is used to determine if ElasticSearch can be used or if it is offline.
      responses:
        '200':
          summary: Successful response
          description: Search service status retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: The status of the search service, including whether it is ready and any relevant messages
                        properties:
                          elasticsearch_available:
                            type: boolean
                            description: Indicates whether ElasticSearch is available for searching
                            example: true
                          fallback_active:
                            type: boolean
                            description: Indicates whether the fallback search method is active (used when ElasticSearch is unavailable)
                            example: false
                          index_exists:
                            type: boolean
                            description: Indicates whether the ElasticSearch index exists and is ready for searching
                            example: true
                          timestamp:
                            type: string
                            format: date-time
                            description: The date and time when the search status was checked
                            example: "2026-03-13T23:19:48.940795+00:00"

  /api/search/advanced:
    get:
      tags: [Search]
      summary: Perform an advanced search for videos
      description: |
        Perform an advanced search for videos based on multiple criteria, such as keywords, categories, speakers, tags, etc.
        This allows for more complex search queries to find relevant videos.
        Note, parameters can be included multiple times to search for multiple values.
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: The general search query string
          example: "with eyes of faith"
        - in: query
          name: speakers
          required: false
          schema:
            type: array
          description: Filter search results by speaker name
          example: ["Stephen Lett"]
        - in: query
          name: characters
          required: false
          schema:
            type: array
          description: Filter search results by character name
          example: ["Jesus"]
        - in: query
          name: locations
          required: false
          schema:
            type: array
          description: Filter search results by location name
          example: ["Africa"]
        - in: query
          name: tags
          required: false
          schema:
            type: array
          description: Filter search results by tag name
          example: ["av"]
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
          description: The page number of the search results to retrieve
          example: 2
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: The number of search results to return per page
          example: 10
      responses:
        '200':
          summary: Successful response
          description: Search results retrieved successfully based on the advanced search query
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: List of video details matching the advanced search criteria
                        properties:
                          total:
                            type: integer
                            description: Total number of videos matching the advanced search criteria
                            example: 123
                          page:
                            type: integer
                            description: The current page number of the search results
                            example: 2
                          pages:
                            type: integer
                            description: Total number of pages available
                            example: 13
                          per_page:
                            type: integer
                            description: The number of search results returned per page
                            example: 10
                          using_elasticsearch:
                            type: boolean
                            description: Indicates whether ElasticSearch was used for the search query
                            example: true
                          filters:
                            type: object
                            description: The filters applied to the search query, including speakers, characters, locations, and tags
                            properties:
                              characters:
                                type: array
                                description: List of character names used as filters in the search query
                                items:
                                  type: string
                                example: ["Jesus"]
                              locations:
                                type: array
                                description: List of location names used as filters in the search query
                                items:
                                  type: string
                                example: ["Africa"]
                              speakers:
                                type: array
                                description: List of speaker names used as filters in the search query
                                items:
                                  type: string
                                example: ["Stephen Lett"]
                              tags:
                                type: array
                                description: List of tag names used as filters in the search query
                                items:
                                  type: string
                                example: ["av"]
                          query:
                            type: string
                            description: The original search query string provided in the request
                            example: "with eyes of faith"
                          results:
                            type: array
                            description: List of video details for the current page of search results
                            items:
                              type: object
                              description: |
                                Details of a video matching the advanced search criteria, including metadata and relevance score.
                                The relevance score indicates how well the video matches the search query and filters.
                              properties:
                                id:
                                  type: number
                                  description: Unique identifier for the video
                                  example: 123
                                video_id:
                                  type: integer
                                  description: Unique identifier for the video
                                  example: 123
                                name:
                                  type: string
                                  description: Name of the video
                                  example: "Language of the Heart"
                                title:
                                  type: string
                                  description: The title of the video, which may be the same as the name or may include additional information
                                  example: "JW Broadcasting—August 2025"
                                description:
                                  type: string
                                  description: The description of this video
                                  example: "A description of the video."
                                bible_character:
                                  type: string
                                  description: A string listing the Bible characters featured in the video, separated by commas
                                  example: "David, Jesus, Daniel"
                                location:
                                  type: string
                                  description: A string listing the locations featured in the video, separated by commas
                                  example: "Africa, Europe"
                                scriptures:
                                  type: string
                                  description: A string listing the scriptures featured in the video, separated by commas
                                  example: "John 3:16, Psalm 23:1"
                                speaker:
                                  type: string
                                  description: A string listing the speakers featured in the video, separated by commas
                                  example: "Stephen Lett, David Schafer"
                                tags:
                                  type: string
                                  description: A string listing the tags associated with the video, separated by commas
                                  example: "tag-1, tag-2"
                                thumbnail:
                                  type: string
                                  description: URL to the video's thumbnail image
                                  example: "https://cms-imgp.jw-cdn.org/img/p/jwb-129/univ/art/jwb-129_univ_wss_01_lg.jpg"
                                chapter_markers:
                                  type: string
                                  description: A string listing the chapter markers on this video
                                  example: "Chapter 1: Introduction, Chapter 2: The Journey"
                                duration:
                                  type: integer
                                  description: The duration of the video in seconds
                                  example: 3600
                                score:
                                  type: number
                                  description: The relevance score of the video for the search query and filters, where a higher score indicates a more relevant result
                                  example: 11.7441025
                                watched:
                                  type: boolean
                                  description: Indicates whether the video has been marked as watched for the profile making the search request (if applicable)
                                  example: true
                                highlights:
                                  type: array
                                  description: |
                                    A list of highlighted snippets from the video that match the search query, providing context for why the video was returned in the search results
                                    Highlighting uses HTML emphasis tags (<em></em>)
                                  items:
                                    type: object
                                    properties:
                                      bible_character:
                                        type: string
                                        description: The Bible character mentioned in the highlighted snippet (if applicable)
                                        example: "<em>David</em>, Jesus, Daniel"
                                      chapter_markers:
                                        type: string
                                        description: The chapter markers mentioned in the highlighted snippet (if applicable)
                                        example: "Chapter 1: Introduction, <em>Chapter 2: The Journey</em>"
                                      description:
                                        type: string
                                        description: The description text of the highlighted snippet
                                        example: "Theme: Imitate Jehovah's <em>Generosity</em>"
                                      location:
                                        type: string
                                        description: The location mentioned in the highlighted snippet (if applicable)
                                        example: "Africa, <em>Europe</em>"
                                      speaker:
                                        type: string
                                        description: The speaker mentioned in the highlighted snippet (if applicable)
                                        example: "<em>Stephen Lett</em>, David Schafer"
                                      tags:
                                        type: string
                                        description: The tags mentioned in the highlighted snippet (if applicable)
                                        example: "<em>tag-1</em>, tag-2"
                                      transcript:
                                        type: string
                                        description: The transcript text of the highlighted snippet
                                        example: "This is a transcript of the video, with <em>highlighted</em> sections that match the search query."
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/search/reindex:
    post:
      tags: [Search, Admin]
      summary: Reindex videos for search
      description: |
        Reindex all videos for the search service.
        This is used to update the search index after changes to video metadata or when new videos are added.
      responses:
        '200':
          summary: Successful response
          description: Search index reindexed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: The result of the reindexing operation, including any relevant messages
                        properties:
                          failed:
                            type: integer
                            description: The number of videos that failed to be indexed during the reindexing operation
                            example: 0
                          success:
                            type: integer
                            description: The number of videos that were successfully indexed during the reindexing operation
                            example: 1000
                          total:
                            type: integer
                            description: The total number of videos that were processed during the reindexing operation
                            example: 1000
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # --------------
  #   Similarity
  # --------------

  /api/similarity/{video_id}:
    get:
      tags: [Similarity]
      summary: Retrieve similar videos
      description: |
        Get a list of videos similar to a specified video based on content and metadata.
        This allows for finding related videos that may be of interest to the user.
        Gets the top 10 most similar videos based on the specified video ID.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
          description: The ID of the video to find similar videos for
          example: 123
      responses:
        '200':
          summary: Successful response
          description: Similar videos retrieved successfully based on the specified video ID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of videos similar to the specified video, including their IDs, names, and similarity scores
                        items:
                          type: object
                          properties:
                            video_1_id:
                              type: integer
                              description: Unique identifier for the first video in the similarity comparison
                              example: 123
                            video_2_id:
                              type: integer
                              description: Unique identifier for the second video in the similarity comparison
                              example: 456
                            score:
                              type: number
                              description: The similarity score between the two videos, where a higher score indicates greater similarity
                              example: 0.85
                              minimum: 0.00
                              maximum: 1.00
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------
  #   Profile Management
  # ----------------------
  /api/profile:
    get:
      tags: [Profiles]
      summary: Retrieve a list of all profiles
      description: |
        Get all user profiles.
      responses:
        '200':
          summary: Successful response
          description: User profiles retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: A list of user profiles, including their IDs and names
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for the user profile
                              example: 1
                            name:
                              type: string
                              description: Name of the user profile
                              example: "John"
                            image:
                              type: string
                              description: Filename for the user profile's image
                              example: "profile.jpg"
                            admin:
                              type: boolean
                              description: Indicates whether the profile has admin privileges
                              example: false
                            created_at:
                              type: string
                              format: date-time
                              description: The date and time when the user profile was created
                              example: "2025-06-30 01:24:03"

  /api/profile/{profile_id}:
    get:
      tags: [Profiles]
      summary: Retrieve a specific user profile
      description: |
        Get details for a specific user profile by its ID.
      parameters:
        - in: path
          name: profile_id
          required: true
          schema:
            type: integer
          description: The ID of the user profile to retrieve
          example: 1
      responses:
        '200':
          summary: Successful response
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Details of the specified user profile, including ID, name, image filename, admin status, and creation timestamp
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for the user profile
                            example: 1
                          name:
                            type: string
                            description: Name of the user profile
                            example: "John"
                          image:
                            type: string
                            description: Filename for the user profile's image
                            example: "amos_1.png"
                          admin:
                            type: integer
                            description: |
                              Indicates whether the profile has admin privileges.
                              This is represented as an integer (0 for false, 1 for true) to align with database storage.
                            example: 0
                          created_at:
                            type: string
                            format: date-time
                            description: The date and time when the user profile was created
                            example: "2025-06-30 01:24:03"
        '404':
          $ref: '#/components/responses/NotFound'

  /api/profile/mark_watched:
    post:
      tags: [Profiles]
      summary: Mark a video as watched
      description: |
        Mark a video as watched for a specific user profile.
        This updates the watch history for the profile, allowing the UI to reflect watched status.
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to mark the video as watched for. 
            If not provided, 'guest' will be assumed and no changes will be made to any profile.
          example: 1
      requestBody:
        description: The video ID to mark as watched
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestVideoID'
      responses:
        '200':
          summary: Successful response
          description: Video marked as watched successfully for the profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/profile/mark_unwatched:
    post:
      tags: [Profiles]
      summary: Mark a video as unwatched
      description: |
        Mark a video as unwatched for a specific user profile.
        This updates the watch history for the profile, allowing the UI to reflect unwatched status.
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to mark the video as unwatched for. 
            If not provided, 'guest' will be assumed and no changes will be made to any profile.
          example: 1
      requestBody:
        description: The video ID to mark as unwatched
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestVideoID'
      responses:
        '200':
          summary: Successful response
          description: Video marked as unwatched successfully for the profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/profile/mark_watched_bulk:
    post:
      tags: [Profiles]
      summary: Check watch status for multiple videos
      description: |
        Check multiple videos to see if they have been marked as watched.
        This checks against a profile ID included in the request.
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to check against. 
            If not provided, 'guest' will be assumed and no results will be returned.
          example: 1
      requestBody:
        description: A list of video IDs to check and the profile ID
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestVideoIDs'
      responses:
        '200':
          summary: Successful response
          description: Successfully checked watched status for the profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Watch status for each video ID, where the key is the video ID and the value is a boolean indicating watched status
                        additionalProperties:
                          type: boolean
                          description: Indicates whether the video has been marked as watched for the profile
                        example:
                          "123": true
                          "456": false
                          "789": true
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/profile/in_progress:
    get:
      tags: [Profiles]
      summary: Retrieve in-progress videos for a profile
      description: |
        This tracks where a video is up to, so it can be resumed there in future.  
        Specifically, the GET method will either:  
        * Get a list of in progress videos for a particular profile  
        * Check if a specific video is in progress for a specific profile  
      parameters:
        - in: query
          name: profile
          required: true
          schema:
            type: integer
          description: |
            The ID of the user profile to retrieve in-progress videos for. 
            If not provided, 'guest' will be assumed and an empty list will be returned.
          example: 1
        - in: query
          name: video_id
          required: false
          schema:
            type: integer
          description: |
            The ID of the video to check for in-progress status.
            If not provided, a list of all in-progress videos for the profile will be returned.
          example: 123
      responses:
        '200':
          summary: Successful response
          description: In-progress videos for the specified profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of in-progress videos for the specified profile, including video IDs and current playback times
                        items:
                          type: object
                          properties:
                            profile_id:
                              type: integer
                              description: Unique identifier for the user profile
                              example: 2
                            video_id:
                              type: integer
                              description: Unique identifier for the video
                              example: 123
                            current_time:
                              type: integer
                              description: The current playback time of the video in seconds
                              example: 1200
                            updated_at:
                              type: string
                              format: date-time
                              description: The date and time when the in-progress status was last updated
                              example: "2026-01-17 07:14:08"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Profiles]
      summary: Update in progress video status
      description: |
        Manages in-progress video tracking for user profiles.  
        This adds a video to the list of in progress videos for the specific profile, and stores the playback location of the video.  
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to update in-progress videos for. 
            If not provided, 'guest' will be assumed and video progress will not be tracked.
          example: 1
      requestBody:
        description: The video ID and current playback time to mark as in-progress
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_id:
                  type: integer
                  description: The ID of the video to mark as in-progress
                  example: 123
                current_time:
                  type: integer
                  description: The current playback time of the video in seconds
                  example: 1200
      responses:
        '201':
          summary: Successful response
          description: In-progress videos updated successfully for the profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Profiles]
      summary: Remove a video from in-progress tracking
      description: |
        Remove a video from the list of in progress videos for the specific profile.
        This is used when a video is completed or no longer being tracked as in-progress.
      parameters:
        - in: query
          name: profile
          required: true
          schema:
            type: integer
          description: |
            The ID of the user profile to remove the in-progress video for. 
          example: 1
      requestBody:
        description: The video ID to remove from in-progress tracking
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestVideoID'
      responses:
        '200':
          summary: Successful response
          description: In-progress video removed successfully for the profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/profile/watch_history:
    get:
      tags: [Profiles]
      summary: Retrieve watch history for a profile
      description: |
        Get the watch history for a specific user profile.
        This allows the UI to display recently watched videos and continue watching in-progress videos.
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to retrieve watch history for. 
            If not provided, 'guest' will be assumed and an empty watch history will be returned.
          example: 1
      responses:
        '200':
          summary: Successful response
          description: Watch history for the specified profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        description: List of watched videos for the specified profile, including video IDs and timestamps
                        items:
                          type: object
                          properties:
                            profile_id:
                              type: integer
                              description: Unique identifier for the user profile
                              example: 2
                            video_id:
                              type: integer
                              description: Unique identifier for the video
                              example: 1871
                            current_time:
                              type: integer
                              description: The last playback time of the video in seconds
                              example: 60
                            watched_at:
                              type: string
                              format: date-time
                              description: The date and time when the video was watched
                              example: "2026-01-18 12:51:26.409769"
        '404':
