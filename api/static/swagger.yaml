  /api/profile/in_progress:
    get:
      tags: [Profiles]
      summary: Retrieve in-progress videos for a profile
      description: |
        This tracks where a video is up to, so it can be resumed there in future.
        Specifically, the GET method will either:
        * Get a list of in progress videos for a particular profile
        * Check if a specific video is in progress for a specific profile
      parameters:
        - in: query
          name: profile
          required: true
          schema:
            type: integer
          description: |
            The ID of the user profile to retrieve in-progress videos for. 
            If not provided, 'guest' will be assumed and an empty list will be returned.
          example: 1
        - in: query
          name: video_id
          required: false
          schema:
            type: integer
          description: |
            The ID of the video to check for in-progress status.
            If not provided, a list of all in-progress videos for the profile will be returned.
          example: 123
      responses:
        '200':
          summary: Successful response
          description: In-progress videos for the specified profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of in-progress videos for the specified profile, including video IDs and current playback times
                    items:
                      type: object
                      properties:
                        profile_id:
                          type: integer
                          description: Unique identifier for the user profile
                          example: 2
                        video_id:
                          type: integer
                          description: Unique identifier for the video
                          example: 123
                        current_time:
                          type: integer
                          description: The current playback time of the video in seconds
                          example: 1200
                        updated_at:
                          type: string
                          format: date-time
                          description: The date and time when the in-progress status was last updated
                          example: "2026-01-17 07:14:08"
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: In-progress videos retrieved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
