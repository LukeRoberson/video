          example: 1
        name:
          type: string
          description: Name of the speaker
          example: "Stephen Lett"
        profile_pic:
          type: string
          description: The filename of the speaker's profile picture
          example: "1-Stephen_Lett.png"
        video_count:
          type: integer
          description: The number of videos associated with the speaker
          example: 5
    CharacterItem:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the character
          example: 230
        name:
