openapi: 3.0.4

info:
  title: Video Player
  version: 1.0.0
  description: |
    The backend API for the modern web-based video streaming interface for accessing educational content from jw.org and JW Library.
    This manages the backend database opterations, as well as profiles.

servers:
  - url: /
    description: Main server

tags:
  - name: Videos
    description: Information about videos, including metadata and streaming URLs.
  - name: Categories
    description: Category information for videos, reflecting those used on jw.org and JW Library.
  - name: Bible Characters
    description: Information about Bible characters featured in the videos.
  - name: Scriptures
    description: Information about scriptures referenced in the videos.
  - name: Speakers
    description: Information about speakers featured in the videos.
  - name: Tags
    description: Information about tags associated with the videos.
  - name: Search
    description: Endpoints for searching videos based on various criteria.
  - name: Similarity
    description: Endpoints for finding similar videos based on content and metadata.
  - name: Profiles
    description: Information about user profiles and their preferences.

paths:
  # Videos
  /api/videos/get_bulk:
    post:
      tags: [Videos]
      summary: Retrieve a list of videos
      description: |
        Get details for multiple videos at once.
        This is more efficient than making individual requests for each video.
      requestBody:
        description: A list of video IDs to retrieve
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_ids:
                  type: array
                  description: List of video IDs to retrieve
                  items:
                    type: string
                  example: ["video1", "video2", "video3"]
      responses:
        '200':
          summary: Successful response
          description: A list of videos retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of video details
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: Unique identifier for the video
                          example: 123
                        name:
                          type: string
                          description: Name of the video
                          example: "Language of the Heart"
                        description:
                          type: string
                          description: A brief description of the video
                        duration:
                          type: integer
                          description: Duration of the video in seconds
                          example: 3600
                        date_added:
                          type: string
                          format: date-time
                          description: The date and time when the video was added to the database
                          example: "2024-01-01T12:00:00Z"
                        thumbnail:
                          type: string
                          description: URL to the video's thumbnail image
                          example: "https://cms-imgp.jw-cdn.org/img/p/jwbcov22/univ/art/jwbcov22_univ_wss_06_lg.jpg"
                        url:
                          type: string
                          description: URL to stream the video
                          example: "https://www.jw.org/en/library/videos/#en/mediaitems/pub-jwb-095_5_VIDEO"
                        url_1080:
                          type: string
                          description: URL to stream the video in 1080p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r1080P.mp4"
                        url_720:
                          type: string
                          description: URL to stream the video in 720p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r720P.mp4"
                        url_480:
                          type: string
                          description: URL to stream the video in 480p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r480P.mp4"
                        url_360:
                          type: string
                          description: URL to stream the video in 360p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r360P.mp4"
                        url_240:
                          type: string
                          description: URL to stream the video in 240p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r240P.mp4"
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Videos retrieved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/videos/filter:
    get:
      tags: [Videos]
      summary: Retrieve a filtered list of videos
      description: |
        Get a list of videos filtered by various criteria, such as category, speaker, scripture, etc.
        This allows for more specific queries to find relevant videos.
        At least one filter parameter must be provided.
      parameters:
        - in: query
          name: cat
          required: false
          schema:
            type: integer
          description: Filter videos by category ID
          example: 1
        - in: query
          name: tag
          required: false
          schema:
            type: integer
          description: Filter videos by tag ID
          example: 1
        - in: query
          name: loc
          required: false
          schema:
            type: integer
          description: Filter videos by location ID
          example: 1
        - in: query
          name: speak
          required: false
          schema:
            type: integer
          description: Filter videos by a speaker's ID
          example: 1
        - in: query
          name: char
          required: false
          schema:
            type: integer
          description: Filter videos by character ID
          example: 1
        - in: query
          name: scrip
          required: false
          schema:
            type: integer
          description: Filter videos by scripture ID
          example: 1
        - in: query
          name: latest
          required: false
          schema:
            type: integer
          description: Limit the results to the latest N videos
          example: 5
      responses:
        '200':
          summary: Successful response
          description: A filtered list of videos retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of video details matching the filter criteria
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: Unique identifier for the video
                          example: 123
                        name:
                          type: string
                          description: Name of the video
                          example: "Language of the Heart"
                        description:
                          type: string
                          description: A brief description of the video
                        duration:
                          type: integer
                          description: Duration of the video in seconds
                          example: 3600
                        date_added:
                          type: string
                          format: date-time
                          description: The date and time when the video was added to the database
                          example: "2024-01-01T12:00:00Z"
                        thumbnail:
                          type: string
                          description: URL to the video's thumbnail image
                          example: "https://cms-imgp.jw-cdn.org/img/p/jwbcov22/univ/art/jwbcov22_univ_wss_06_lg.jpg"
                        url:
                          type: string
                          description: URL to stream the video
                          example: "https://www.jw.org/en/library/videos/#en/mediaitems/pub-jwb-095_5_VIDEO"
                        url_1080:
                          type: string
                          description: URL to stream the video in 1080p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r1080P.mp4"
                        url_720:
                          type: string
                          description: URL to stream the video in 720p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r720P.mp4"
                        url_480:
                          type: string
                          description: URL to stream the video in 480p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r480P.mp4"
                        url_360:
                          type: string
                          description: URL to stream the video in 360p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r360P.mp4"
                        url_240:
                          type: string
                          description: URL to stream the video in 240p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/a05279/1/o/jwb-095_E_05_r240P.mp4"
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Videos retrieved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/videos/metadata:
    get:
      tags: [Videos]
      summary: Retrieve video metadata
      description: |
        Resolve metadata names to IDs. For example, a location name to a location ID.
        This endpoint allows multiple resolution types in a single request.
        Not all metadata fields need to be provided; only those that need to be resolved.
        Can be used to resolve videos, tags, locations, speakers, and characters.
      parameters:
        - in: query
          name: video_name
          required: false
          schema:
            type: string
          description: The name of the video to resolve to an ID
          example: "Can Love Conquer Hatred?"
        - in: query
          name: tag_name
          required: false
          schema:
            type: string
          description: The name of the tag to resolve to an ID
          example: "av"
        - in: query
          name: location_name
          required: false
          schema:
            type: string
          description: The name of the location to resolve to an ID
          example: "Africa"
        - in: query
          name: speaker_name
          required: false
          schema:
            type: string
          description: The name of the speaker to resolve to an ID
          example: "Stephen Lett"
        - in: query
          name: character_name
          required: false
          schema:
            type: string
          description: The name of the character to resolve to an ID
          example: "Jesus"
      responses:
        '200':
          summary: Successful response
          description: Metadata resolved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Resolved metadata with names and corresponding IDs
                    properties:
                      video_id:
                        type: integer
                        description: Unique identifier for the video
                        nullable: true
                      tag_id:
                        type: integer
                        description: Unique identifier for the tag
                        nullable: true
                      location_id:
                        type: integer
                        description: Unique identifier for the location
                        nullable: true
                      speaker_id:
                        type: integer
                        description: Unique identifier for the speaker
                        nullable: true
                      character_id:
                        type: integer
                        description: Unique identifier for the character
                        nullable: true
                    example:
                      video_id: 123
                      tag_id: 45
                      location_id: 67
                      speaker_id: 89
                      character_id: 10
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Metadata resolved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true

  # Videos to do:
    # POST /api/videos/metadata
    # /api/videos/csv
    # /api/videos/add

  # Categories
  /api/categories:
    get:
      tags: [Categories]
      summary: Retrieve a list of categories
      description: |
        Get a list of all categories in the database, reflecting those used on jw.org and JW Library.
        Includes the names of the categories, as well as their IDs.
      responses:
        '200':
          summary: Successful response
          description: A list of categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: All categories with names and IDs
                    additionalProperties:
                      type: integer
                      description: Unique identifier for the category
                    example:
                      "Monthly Programs": 1
                      "Bible Teachings": 51
                      "Dramas": 1349
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Categories retrieved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
    post:
      tags: [Categories]
      summary: Get a filtered list of categories
      description: |
        Get a filtered list of categories by name.
        This resolves names to category IDs.
      requestBody:
        description: The name of the categories to filter by
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                name:
                  type: string
                  description: Name of the category to resolve to ID
                  example: "Monthly Programs"
      responses:
        '200':
          summary: Successful response
          description: A filtered list of categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of resolved categories matching the filter
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: Unique identifier for the category
                          example: 1
                        name:
                            type: string
                            description: Name of the category
                            example: "Monthly Programs"
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Categories retrieved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/categories/{{category_name}}:
    get:
      tags: [Categories]
      summary: Resolve a category name to its ID
      description: |
        Get the ID of a specific category by its name.
        This allows for resolving category names to their corresponding IDs.
      parameters:
        - in: path
          name: category_name
          required: true
          schema:
            type: string
          description: The name of the category to resolve to an ID
          example: "Monthly Programs"
      responses:
        '200':
          summary: Successful response
          description: The ID of the specified category retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of resolved categories matching the filter
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: Unique identifier for the category
                          example: 1
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Category retrieved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
          '404':
            $ref: '#/components/responses/NotFound'

  /api/categories/{category_id}/{subcategory_id}:
    get:
      tags: [Categories]
      summary: Retrieve videos for a category and subcategory
      description: |
        Get a list of videos for a specific category and subcategory combination.
        This allows for browsing videos based on the categories used on jw.org and JW Library.
      parameters:
        - in: path
          name: category_id
          required: true
          schema:
            type: integer
          description: The ID of the category to retrieve videos for
          example: 1
        - in: path
          name: subcategory_id
          required: true
          schema:
            type: integer
          description: The ID of the subcategory to retrieve videos for
          example: 2
      responses:
        '200':
          summary: Successful response
          description: A list of videos for the specified category and subcategory retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of video details for the specified category and subcategory
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: Unique identifier for the video
                          example: 123
                        name:
                          type: string
                          description: Name of the video
                          example: "Language of the Heart"
                        description:
                          type: string
                          description: A brief description of the video
                        duration:
                          type: integer
                          description: Duration of the video in seconds
                          example: 3600
                        date_added:
                          type: string
                          format: date-time
                          description: The date and time when the video was added to the database
                          example: "2025-11-04 00:00:00"
                        thumbnail:
                          type: string
                          description: URL to the video's thumbnail image
                          example: "https://cms-imgp.jw-cdn.org/img/p/jwb-132/univ/art/jwb-132_univ_wss_01_lg.jpg"
                        url:
                          type: string
                          description: URL to stream the video
                          example: "https://www.jw.org/en/library/videos/#en/mediaitems/LatestVideos/pub-jwb-132_1_VIDEO"
                        url_1080:
                          type: string
                          description: URL to stream the video in 1080p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/d7ad66/1/o/jwb-132_E_01_r1080P.mp4"
                        url_720:
                          type: string
                          description: URL to stream the video in 720p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/d7ad66/1/o/jwb-132_E_01_r720P.mp4"
                        url_480:
                          type: string
                          description: URL to stream the video in 480p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/d7ad66/1/o/jwb-132_E_01_r480P.mp4"
                        url_360:
                          type: string
                          description: URL to stream the video in 360p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/d7ad66/1/o/jwb-132_E_01_r360P.mp4"
                        url_240:
                          type: string
                          description: URL to stream the video in 240p resolution
                          example: "https://akamd1.jw-cdn.org/sg2/p/d7ad66/1/o/jwb-132_E_01_r240P.mp4"
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Videos retrieved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true

  /api/categories/video/{{video_id}}:
    get:
      tags: [Categories]
      summary: Retrieve categories for a video
      description: |
        Get the categories associated with a specific video.
        This allows for understanding the categorization of videos.
      parameters:
        - in: path
          name: video_id
          required: true
          schema:
            type: integer
          description: The ID of the video to retrieve categories for
          example: 123
      responses:
        '200':
          summary: Successful response
          description: Categories for the specified video retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of categories associated with the specified video, including category names and IDs
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the category
                          example: 1
                        name:
                          type: string
                          description: Name of the category
                          example: "Monthly Programs"
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Categories retrieved successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '404':
          $ref: '#/components/responses/NotFound'

  # Bible Characters
  # Scriptures
  # Speakers
  # Tags
  # Search
  # Similarity

  # /api/profile
  /api/profile/mark_watched:
    post:
      tags: [Profiles]
      summary: Mark a video as watched
      description: |
        Mark a video as watched for a specific user profile.
        This updates the watch history for the profile, allowing the UI to reflect watched status.
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to mark the video as watched for. 
            If not provided, 'guest' will be assumed and no changes will be made to any profile.
          example: 1
      requestBody:
        description: The video ID to mark as watched
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_id:
                  type: integer
                  description: The ID of the video to mark as watched
                  example: 123
      responses:
        '200':
          summary: Successful response
          description: Video marked as watched successfully for the profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Video marked as watched successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/profile/mark_unwatched:
    post:
      tags: [Profiles]
      summary: Mark a video as unwatched
      description: |
        Mark a video as unwatched for a specific user profile.
        This updates the watch history for the profile, allowing the UI to reflect unwatched status.
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to mark the video as unwatched for. 
            If not provided, 'guest' will be assumed and no changes will be made to any profile.
          example: 1
      requestBody:
        description: The video ID to mark as unwatched
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_id:
                  type: integer
                  description: The ID of the video to mark as unwatched
                  example: 123
      responses:
        '200':
          summary: Successful response
          description: Video marked as unwatched successfully for the profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Video marked as unwatched successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/profile/mark_watched_bulk:
    post:
      tags: [Profiles]
      summary: Check watch status for multiple videos
      description: |
        Check multiple videos to see if they have been marked as watched.
        This checks against a profile ID included in the request.
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to check against. 
            If not provided, 'guest' will be assumed and no results will be returned.
          example: 1
      requestBody:
        description: A list of video IDs to check and the profile ID
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_ids:
                  type: array
                  description: List of video IDs to check for watch status
                  items:
                    type: integer
                  example: [123, 456, 789]
      responses:
        '200':
          summary: Successful response
          description: Successfully checked watched status for the profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Watch status for each video ID, where the key is the video ID and the value is a boolean indicating watched status
                    additionalProperties:
                      type: boolean
                      description: Indicates whether the video has been marked as watched for the profile
                    example:
                      "123": true
                      "456": false
                      "789": true
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: Successfully checked watched status
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/profile/in_progress:
    post:
      tags: [Profiles]
      summary: Update in progress video status
      description: |
        Manages in-progress video tracking for user profiles.
        This adds a video to the list of in progress videos for the specific profile, and stores the playback location of the video.
      parameters:
        - in: query
          name: profile
          required: false
          schema:
            type: integer
          description: |
            The ID of the user profile to update in-progress videos for. 
            If not provided, 'guest' will be assumed and video progress will not be tracked.
          example: 1
      requestBody:
        description: The video ID and current playback time to mark as in-progress
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video_id:
                  type: integer
                  description: The ID of the video to mark as in-progress
                  example: 123
                current_time:
                  type: integer
                  description: The current playback time of the video in seconds
                  example: 1200
      responses:
        '201':
          summary: Successful response
          description: In-progress videos updated successfully for the profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A message indicating the result of the operation
                    example: In-progress videos updated successfully
                  success:
                    type: boolean
                    description: Indicates whether the operation was successful
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Profiles to do:
    # /api/profiles
    # /api/profiles/{{profile_id}}
    # /api/profiles/create
    # /api/profiles/delete/{{profile_id}}
    # /api/profiles/update/{{profile_id}}
    # /api/profiles/watch_history
    # /api/profiles/clear_history/{{profile_id}}
    # GET /api/profiles/in_progress
    # DELETE /api/profiles/in_progress
    # GET /api/profiles/mark_watched


components:
  schemas:
    TBA:
      type: object
      properties:
        TBA:
          type: integer
          description: TBA

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: No data provided

  responses:
    NotFound:
      description: 404 Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: 400 Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message
                example: video_ids must be a list of integers
              success:
                type: boolean
                description: Set to false, as the request was invalid
                example: false
    UnsupportedMediaType:
      description: 415 Unsupported media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 500 Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
