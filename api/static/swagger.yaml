components:
  schemas:
    TBA:
      type: object
      properties:
        TBA:
          type: integer
          description: TBA

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: No data provided

  responses:
    NotFound:
      description: 404 Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: 400 Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message
                example: video_ids must be a list of integers
              success:
                type: boolean
                description: Set to false, as the request was invalid
                example: false
    UnsupportedMediaType:
      description: 415 Unsupported media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 500 Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 503 Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
