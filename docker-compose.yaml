services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    # local.db is in persistent storage. It still needs to be backed up
    volumes:
      # Add this environment variable
      - ${LOCAL_DB_PATH}:/app/local.db

    # To connect to Elasticsearch container
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - private

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    # To find the backend API
    environment:
      - API_BASE_URL=http://backend:5010

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - private

  proxy:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    
    # These are files that need to be mounted as volumes at runtime
    volumes:
      # Add these environment variables
      - ${NGINX_CONF_PATH}:/etc/nginx/nginx.conf
      - ${NGINX_KEY_PATH}:/etc/ssl/certs/nginx.key
      - ${NGINX_CRT_PATH}:/etc/ssl/certs/nginx.crt
      - ${DH_PARAM_PATH}:/etc/ssl/certs/dh-4096.pem
      - ${NGINX_LOG_PATH}:/var/log/nginx

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - private

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.13
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
    
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  esdata:
    driver: local
